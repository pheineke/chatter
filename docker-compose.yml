# Credentials below default to "postgres"/"change-me-in-production" for a
# zero-config local `docker compose up`. For anything reachable outside your
# own machine, create a `.env` next to this file (see `.env.example`) to
# override POSTGRES_PASSWORD / SECRET_KEY / DECORATION_ADMIN_IDS, and set
# ENVIRONMENT=production so the backend refuses to boot if you forgot to.
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-chat}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/static:/app/static
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-chat}
      - STATIC_DIR=/app/static
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      # `-` not `:-` on purpose: `:-` treats an *empty* value as unset and
      # would substitute `*`, so `DECORATION_ADMIN_IDS=` in .env — the
      # natural way to express "nobody is a decoration admin" — would
      # silently mean "everybody is". With `-`, only a genuinely absent
      # variable falls back to the permissive dev default.
      - DECORATION_ADMIN_IDS=${DECORATION_ADMIN_IDS-*}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:80"
    depends_on:
      - backend

volumes:
  postgres_data:

