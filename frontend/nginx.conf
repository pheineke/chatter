# X-Forwarded-Proto for the backend. When a TLS proxy (deploy/Caddyfile) sits
# in front, pass its "https" through; otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Same-origin only. camera: QR login scanning and video calls; microphone:
    # voice channels; display-capture: screen sharing. microphone=() used to
    # block every getUserMedia({audio}) call, i.e. voice chat behind nginx.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    # Content-Security-Policy: blocks inline/eval script execution so that any
    # markup that slips past server-side sanitization (message content, link
    # embeds, uploaded attachments) can't run as script in the app's origin.
    # img-src/media-src allow https: broadly because link-preview thumbnails
    # and Tenor GIFs are rendered directly from third-party URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://tenor.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Uploads: backend allows 8 MB per file (settings.max_upload_size) and
    # rejects bodies over 9 MB by Content-Length; keep this just above that so
    # nginx never buffers more than the backend would accept.
    client_max_body_size 10M;

    # Serve the frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container (stripping the /api prefix if present)
    location ~ ^/api/(me|auth|users|servers|channels|messages|dms|friends|invites|blocks|notifications|static|meta|tokens|decorations|e2ee|audit_logs|interactions|mls)(/.*)?$ {
        # This rewrite drops the /api part before passing it. 
        # So /api/auth/register becomes /auth/register
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (don't append to) X-Forwarded-For: nginx is the edge, and
        # uvicorn trusts this header for rate limiting. Appending would let a
        # client send its own "X-Forwarded-For: <fake>" and dodge per-IP limits.
        # If you put another proxy (Caddy, Cloudflare) in front of nginx, use
        # set_real_ip_from/real_ip_header so $remote_addr is the real client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # The backend sets these too (for deploys without nginx); keep only
        # nginx's copies so browsers don't see duplicate headers.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # WebSocket connections (specifically for chat /ws)
    # Auth no longer travels as a ?token= query param — the client sends it
    # as a {"type": "auth", ...} frame after connecting instead (see
    # backend/app/ws_auth.py), so there's no token in this URL to leak into
    # the access log in the first place. access_log stays off anyway as
    # cheap defense in depth / noise reduction for a high-frequency endpoint.
    location /ws {
        access_log off;
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Default is 60 s, which drops idle sockets between heartbeats.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
