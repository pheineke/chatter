# Mounted into the frontend container by docker-compose.prod.yml.
# Behind Caddy, nginx's $remote_addr is Caddy's container IP; take the client
# IP from the X-Forwarded-For Caddy sets instead, so the backend's per-IP rate
# limits see real clients. Safe only because the prod overlay stops
# publishing nginx's port: just containers on the Docker network can reach it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
