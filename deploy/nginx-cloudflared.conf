# Mounted into the frontend container by docker-compose.cloudflared.yml.
#
# With cloudflared running on the host and pointing at http://localhost:9090,
# every request reaches nginx from the Docker bridge gateway, so all visitors
# share one IP: per-IP rate limits become global, and six bad logins from
# anyone lock a username for everyone.
#
# Cloudflare's edge sets CF-Connecting-IP to the real client address and
# overwrites any value a client sends. The overlay publishes nginx on
# 127.0.0.1 only, so the only clients are processes on this machine
# (cloudflared): trusting the header from any private address is then safe.
# The gateway's range differs per host and network (172.x, 10.x, ...).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
