name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    # Tests run against real Postgres (same major version as docker-compose)
    # so Postgres-only behaviour (UUIDs, enums, partial/functional indexes,
    # ILIKE) is exercised. Locally the suite defaults to SQLite; set
    # TEST_DATABASE_URL to match CI.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chat_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Blocking: real errors only (syntax errors, invalid comparisons, …).
      - run: ruff check . --select E9,F63,F7
      # Informational until the existing lint debt is paid down (see TODO.md).
      - run: ruff check . --statistics
        continue-on-error: true
      - name: Migrations apply from scratch and the latest ones round-trip
        # Separate database so pytest starts from a clean one. Only recent
        # migrations are reversible (downgrading to base fails in the old
        # f7a8b9c0d1e2), so round-trip the last two.
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chat_mig
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE chat_mig"
          alembic upgrade head
          alembic downgrade -2
          alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # `build` runs `tsc` first, so this also type-checks.
      - run: npm run build

  # Known-vulnerability scan of the pinned dependencies (security_pass S29).
  # Fails the build on any advisory for a backend package, and on high or
  # critical advisories for frontend runtime packages (dev tooling such as
  # vite/vitest never ships in the built bundle, so it is not gated here).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: pip-audit (backend)
        run: pip-audit --requirement backend/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (frontend runtime deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
